[project]
name = "niftytradingai"
version = "0.1.0"
description = "NIFTY options paper-trading research platform (Phase 1: data recorder)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
