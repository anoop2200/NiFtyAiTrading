  sources:
    - https://www.tickertape.in/blog/nse-holidays-2026/  (updated 2025-12-30)
    - https://www.angelone.in/news/market-updates/indian-stock-market-holidays-2026-full-nse-trading-calendar-and-key-dates  (updated 2025-12-29)
  checks:
    - Both sources list the same 15 weekday closures.
    - "optionchain_db history 2026-08-27..2026-11-25 has no data on any listed holiday in that range
       (09-14, 10-02, 10-20, 11-10, 11-24)."
    - "NIFTY weekly expiries in that history moved to Monday for the Tuesday holidays
       10-20, 11-10 and 11-24 (10-19, 11-09, 11-23), matching the previous-trading-day rule."
  todo: Read NSE circular "Trading holidays for the calendar year 2026" (F&O) and set status to nse_circular.

